<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jeu 3D - Sphère Runner avec Sons</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            text-align: center;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
            display: none;
            text-align: center;
            width: 100%;
        }
        #gameover span {
            font-size: 18px;
            color: white;
            display: block;
            margin-top: 15px;
        }
        .touch-btn {
            position: absolute;
            bottom: 30px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            z-index: 10;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(233, 69, 96, 0.5);
            border-color: #e94560;
        }
        #btnLeft { left: 30px; }
        #btnRight { right: 30px; }
    </style>
</head>
<body>

    <div id="ui">Score : <span id="score">0</span></div>
    <div id="gameover">GAME OVER<span>Touchez l'écran ou ESPACE pour rejouer</span></div>

    <button id="btnLeft" class="touch-btn">◀</button>
    <button id="btnRight" class="touch-btn">▶</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- GESTION AUDIO (Web Audio API) ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Son de score (bip aigu)
        function playScoreSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Note D5
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // Son de collision / Game Over (bruit sourd descendant)
        function playCrashSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- CODE DU JEU 3D ---
        let scene, camera, renderer;
        let player, obstacles = [];
        let score = 0;
        let gameRunning = true;
        let roadLength = 200;
        let spawnTimer = 0;

        let moveLeft = false;
        let moveRight = false;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 20, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 0, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const roadGeometry = new THREE.PlaneGeometry(10, roadLength);
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x16213e, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -roadLength / 2 + 10;
            road.receiveShadow = true;
            scene.add(road);

            for (let i = -roadLength / 2; i < 10; i += 5) {
                const lineGeo = new THREE.PlaneGeometry(0.2, 2);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xe94560 });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(0, 0.01, i);
                scene.add(line);
                obstacles.push({ mesh: line, type: 'line', z: i });
            }

            const playerGeo = new THREE.SphereGeometry(0.6, 32, 32);
            const playerMat = new THREE.MeshStandardMaterial({ 
                color: 0xe94560, 
                metalness: 0.3, 
                roughness: 0.2,
                emissive: 0x53131e
            });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 0.6, 0);
            player.castShadow = true;
            scene.add(player);

            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');

            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); moveLeft = true; });
            btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });
            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); moveRight = true; });
            btnRight.addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });

            document.getElementById('gameover').addEventListener('touchstart', (e) => {
                initAudio();
                if (!gameRunning) resetGame();
            });
        }

        function onKeyDown(e) {
            initAudio();
            if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'Q') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = true;
            if (e.key === ' ' && !gameRunning) resetGame();
        }

        function onKeyUp(e) {
            if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'Q') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = false;
        }

        function spawnObstacle() {
            const width = Math.random() * 1.5 + 1;
            const height = Math.random() * 1.5 + 0.8;
            
            const obsGeo = new THREE.BoxGeometry(width, height, 1);
            const obsMat = new THREE.MeshStandardMaterial({ 
                color: 0x0f3460, 
                metalness: 0.5,
                roughness: 0.4,
                emissive: 0x05162c
            });
            const obstacle = new THREE.Mesh(obsGeo, obsMat);

            const randomX = (Math.random() - 0.5) * 8;
            obstacle.position.set(randomX, height / 2, -70);
            obstacle.castShadow = true;
            
            scene.add(obstacle);
            obstacles.push({
                mesh: obstacle,
                type: 'obstacle',
                width: width,
                height: height
            });
        }

        function update() {
            if (!gameRunning) return;

            const speed = 0.12;
            if (moveLeft && player.position.x > -4.2) player.position.x -= speed;
            if (moveRight && player.position.x < 4.2) player.position.x += speed;

            player.rotation.z -= (moveLeft ? 0.05 : 0) + (moveRight ? -0.05 : 0);

            spawnTimer++;
            if (spawnTimer > 45) {
                spawnObstacle();
                spawnTimer = 0;
            }

            const gameSpeed = 0.4;
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                
                if (obs.type === 'obstacle') {
                    obs.mesh.position.z += gameSpeed;

                    const dx = Math.abs(player.position.x - obs.mesh.position.x);
                    const dz = Math.abs(player.position.z - obs.mesh.position.z);

                    if (dx < (obs.width / 2 + 0.4) && dz < 0.8) {
                        gameOver();
                    }

                    if (obs.mesh.position.z > 10) {
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                        playScoreSound();
                    }
                } else if (obs.type === 'line') {
                    obs.mesh.position.z += gameSpeed;
                    if (obs.mesh.position.z > 10) {
                        obs.mesh.position.z -= roadLength;
                    }
                }
            }

            camera.position.x = player.position.x * 0.3;
        }

        function gameOver() {
            gameRunning = false;
            playCrashSound();
            document.getElementById('gameover').style.display = 'block';
        }

        function resetGame() {
            obstacles.forEach(obs => {
                if (obs.type === 'obstacle') scene.remove(obs.mesh);
            });
            obstacles = obstacles.filter(obs => obs.type === 'line');

            player.position.set(0, 0.6, 0);
            score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('gameover').style.display = 'none';
            spawnTimer = 0;
            gameRunning = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
